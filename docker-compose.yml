version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: buildcorp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: construction_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildcorp-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: construction_db
      JWT_SECRET: buildcorp_super_secret_jwt_key_2026_aiml_srm
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildcorp-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
